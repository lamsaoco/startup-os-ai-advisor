services:
  # PostgreSQL with pgvector extension for vector similarity search
  postgres:
    image: pgvector/pgvector:pg16
    container_name: startup_os_postgres
    environment:
      POSTGRES_DB: startup_os          # default DB for our app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d  # auto-create airflow_db on fresh start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d startup_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin — PostgreSQL web UI (access at http://localhost:5050)
  # Login: admin@admin.com / admin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: startup_os_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"      # Run in desktop mode (no login required)
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # Grafana for monitoring dashboard (Phase 6)
  grafana:
    image: grafana/grafana:latest
    container_name: startup_os_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/monitoring.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning  # auto-provision datasource + dashboards
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards  # dashboard JSON files
    depends_on:
      postgres:
        condition: service_healthy

  airflow:
    build: 
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: startup_os_airflow
    restart: always
    # Run as the same UID as the host user to avoid volume permission errors.
    # Set AIRFLOW_UID=1000 in .env (match `id -u` on your host).
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      - PYTHONPATH=/opt/airflow/.venv/lib/python3.12/site-packages:/opt/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      # Model cache — keep inside mounted volume so it persists across container restarts
      - HF_HOME=/opt/airflow/data/.model_cache
      - FASTEMBED_CACHE_DIR=/opt/airflow/data/.model_cache
      - AIRFLOW__SMTP__SMTP_HOST=${SMTP_HOST}
      - AIRFLOW__SMTP__SMTP_STARTTLS=True
      - AIRFLOW__SMTP__SMTP_SSL=False
      - AIRFLOW__SMTP__SMTP_USER=${SMTP_USER}
      - AIRFLOW__SMTP__SMTP_PASSWORD=${SMTP_PASSWORD}
      - AIRFLOW__SMTP__SMTP_PORT=${SMTP_PORT}
      - AIRFLOW__SMTP__SMTP_MAIL_FROM=${ALERT_EMAIL}
      - _AIRFLOW_DB_UPGRADE=True
      - _AIRFLOW_WWW_USER_CREATE=True
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./.env:/opt/airflow/.env
      - ./ingestion:/opt/airflow/ingestion
      - ./evaluation:/opt/airflow/evaluation
      - ./retrieval:/opt/airflow/retrieval
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: startup_os_streamlit
    restart: always
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_HOST=postgres
      - HF_HOME=/app/data/.model_cache
      - FASTEMBED_CACHE_DIR=/app/data/.model_cache
      - STREAMLIT_THEME_BASE=dark
      - STREAMLIT_THEME_PRIMARY_COLOR=#8b5cf6
      - STREAMLIT_THEME_BACKGROUND_COLOR=#09090b
      - STREAMLIT_THEME_SECONDARY_BACKGROUND_COLOR=#18181b
      - STREAMLIT_THEME_TEXT_COLOR=#c9d1d9
    volumes:
      - ./data:/app/data
      - ./ui:/app/ui
      - ./retrieval:/app/retrieval
      - ./ingestion:/app/ingestion
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  grafana_data:
